<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{WORDMARK}} — Outro</title>
  <!--
    Brand-parameterized HyperFrames outro (1920x1080@30, reference
    duration 4.8s): end-card that closes the video after the Remotion
    body. Tokens are filled by lib/code2motion.fill_hyperframes_template()
    from the channel brand; the default channel reproduces the original
    OpenMontage look exactly.

    Same lint-clean contract as intro.html: one visual clip, leaf audio
    clips with ids, transform-only GSAP, fixed values (no random),
    bounded repeats, fractional timing (S = D / 4.8).
  -->
  <style>
    :root {
      --color-bg: {{BG}};
      --color-fg: {{FG}};
      --color-primary: {{PRIMARY}};
      --color-accent: {{ACCENT}};
      --bg-rgb: {{BG_RGB}};
      --fg-rgb: {{FG_RGB}};
      --primary-rgb: {{PRIMARY_RGB}};
      --accent-rgb: {{ACCENT_RGB}};
      --font-heading: '{{FONT_HEAD}}', 'Outfit', 'Inter', 'Segoe UI', Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; }
    [data-composition-id="root"] {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--color-bg);
      font-family: var(--font-heading);
    }
    .clip { position: absolute; inset: 0; }

    .base {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(var(--accent-rgb), 0.17) 0%, transparent 58%),
        linear-gradient(180deg, var(--color-bg) 0%, rgba(var(--primary-rgb), 0.14) 55%, var(--color-bg) 100%);
    }
    .glow {
      position: absolute; left: 50%; top: 46%;
      width: 1300px; height: 560px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(var(--primary-rgb), 0.13) 0%, transparent 65%);
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.62) 100%);
    }

    .stage-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .card { text-align: center; }
    .mark {
      display: flex; justify-content: center;
      font-size: 108px; font-weight: 800; line-height: 1; /* JS auto-fits */
      color: var(--color-fg);
      text-shadow: 0 10px 60px rgba(0, 0, 0, 0.5);
    }
      .mark span { display: inline-block; }
      .mark .open { color: var(--color-accent); }
      .mark .sp { margin-right: 0.18em; }
    .cta {
      margin-top: 30px;
      font-size: 32px; font-weight: 600;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--color-primary);
    }
    .url {
      margin-top: 18px;
      font-size: 27px; font-weight: 400;
      color: rgba(var(--fg-rgb), 0.66);
      letter-spacing: 0.06em;
    }
    .rule {
      margin: 34px auto 0;
      width: 420px; height: 3px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.8), transparent);
    }
    .fadeout { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>
  <script src="assets/gsap.min.js"></script>
</head>
<body>
  <div data-composition-id="root" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080" data-fps="30">

    <div id="scene" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0">
      <div class="base"></div>
      <div class="glow"></div>
      <div class="vignette"></div>

      <div class="stage-wrap">
        <div class="card">
          <div class="mark" id="wordmark" data-wordmark="{{WORDMARK}}"></div>
          <div class="cta">{{CTA}}</div>
          <div class="url">{{URL}}</div>
          <div class="rule"></div>
        </div>
      </div>

      <div class="fadeout"></div>
    </div>

    <audio id="sfx-chime"  data-start="{{S_CHIME}}"  data-duration="2.0" data-track-index="3" src="assets/chime.wav"  data-volume="0.5"></audio>
    <audio id="sfx-whoosh" data-start="{{S_WHOOSH}}" data-duration="0.6" data-track-index="4" src="assets/whoosh.wav" data-volume="0.3"></audio>

    <script>
      window.__timelines = window.__timelines || {};

      // --- Build the wordmark per-letter spans from the brand wordmark ---
      (function buildWordmark() {
        var el = document.getElementById("wordmark");
        var text = (el.dataset.wordmark || "").trim();
        var words = text.split(/\s+/).filter(Boolean);
        words.forEach(function (w, wi) {
          w.split("").forEach(function (ch) {
            var s = document.createElement("span");
            s.textContent = ch;
            if (wi === 0) s.className = "open";
            el.appendChild(s);
          });
          if (wi < words.length - 1) {
            var sp = document.createElement("span");
            sp.className = "sp";
            sp.innerHTML = "&nbsp;";
            el.appendChild(sp);
          }
        });
        // Auto-fit: reference size 108px fits ~11 letters.
        var letters = text.replace(/\s/g, "").length || 11;
        var fit = Math.max(60, Math.min(108, Math.round(108 * 11 / letters)));
        el.style.fontSize = fit + "px";
      })();

      const tl = gsap.timeline({ paused: true });

      // Fractional timing scale — reference choreography authored at 4.8s.
      const D = {{DURATION}};
      const S = D / 4.8;

      tl.fromTo("#scene", { opacity: 0 }, { opacity: 1, duration: 0.45 * S, ease: "power1.out" }, 0);
      tl.fromTo(".glow", { scale: 0.72, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.6 * S, ease: "power2.out" }, 0.1 * S);

      // Wordmark rises with overshoot, per-letter
      tl.fromTo(".mark span",
        { y: 110, opacity: 0, scale: 1.24 },
        { y: 0, opacity: 1, scale: 1, duration: 0.6 * S, ease: "back.out(1.8)", stagger: 0.045 * S },
        0.3 * S);

      tl.fromTo(".cta",  { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55 * S, ease: "power3.out" }, 1.15 * S);
      tl.fromTo(".url",  { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5 * S,  ease: "power3.out" }, 1.4 * S);
      tl.fromTo(".rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.55 * S, ease: "power2.out" }, 1.6 * S);

      // Gentle hold float (bounded)
      tl.to(".card", { y: -8, duration: 0.9 * S, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.9 * S);

      // Fade to black
      tl.to(".fadeout", { opacity: 1, duration: 0.9 * S, ease: "power1.in" }, Math.max(0, D - 0.9));

      window.__timelines["root"] = tl;
    </script>
  </div>
</body>
</html>
